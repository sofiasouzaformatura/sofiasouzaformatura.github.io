<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#100706"><title>Formatura em Direito | Sofia Souza</title><meta name="description" content="Convite de formatura em Direito — Sofia Souza, 2027."><style>
*{box-sizing:border-box}html{background:#090504;color:#f2e6d2;scroll-behavior:smooth}body{margin:0;font-family:Georgia,serif}main{width:min(100%,900px);margin:auto}section{position:relative;line-height:0}img{display:block;width:100%;height:auto}button.hot,a.hot{position:absolute;border:0;backgatround:transparent;cursor:pointer;border-radius:100px;touch-action:manipulation}button.hot:focus-visible,a.hot:focus-visible{outline:3px solid #fff4ca;outline-offset:3px}.cover{min-height:100svh;display:grid;align-items:center;transition:opacity .8s ease,transform .8s ease}.cover.closing{opacity:0;transform:scale(1.025);pointer-events:none}.cover [data-open]{left:11.8%;top:83%;width:35.3%;height:11.5%}.inside{animation:reveal 1s ease both}.inside[hidden],.cover[hidden]{display:none}.map{display:block;z-index:5;left:30%;top:78.5%;width:40%;height:14%;-webkit-tap-highlight-color:transparent}.rsvp{left:31.4%;top:74%;width:37%;height:12%}#notice{line-height:1.5;text-align:center;padding:12px 20px;color:#e8c991;font-size:15px}#notice[hidden]{distplay:none}@keyframes reveal{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.guest{position:absolute;left:10%;right:10%;top:43%;height:16%;display:grid;place-items:center;text-align:center;color:#e7c78a;font-style:italic;font-size:clamp(16px,4.1vw,38px);line-height:1.15;text-shadow:0 2px 4px #000;pointer-events:none}.rsvp:disabled{cursor:default}.confirmed-label{position:absolute;left:31.4%;top:74%;width:37%;height:12%;border-radius:100px;background:linear-gradient(170deg,#f8dfa2,#bc8c42);color:#231407;display:grid;place-items:center;text-align:center;font-size:clamp(10px,2vw,20px);line-height:1.1;font-weight:bold;pointer-events:none}.confirmed-label[hidden]{display:none} </style></head><body><main><div class="cover" id="cover"><section><img src="1.png" alt="Formatura em Direito, 2027, Dra. Sofia Souza. Bacharela em Direito."><button class="hot" data-open aria-label="Abrir convite"></button></section></div><div class="inside" id="inside" hidden><section><img src="2.png" alt="Entre livros, leis, noites mal dormidas e incontáveis desafios, chegou o momento de celebrar uma das conquistas mais importantes da minha vida. E quero compartilhar esse momento com você."></section><section><img id="date" src="3.png" alt="Colação de grau, 20 de janeiro de 2027, quarta-feira, às 19 horas, Armazém Convention."><a class="hot map" id="map" href="https://www.google.com/maps/dir/?api=1&amp;destination=Armaz%C3%A9m+Convention%2C+Av.+Luiz+Tarqu%C3%ADnio+Pontes%2C+827%2C+Lauro+de+Freitas%2C+BA" target="_blank" rel="noopener noreferrer" aria-label="Ver localização no Google Maps"></a></section><section><img src="5.png" alt="Confirmação de presença até 12 de janeiro de 2027."><div class="guest" id="guest" aria-live="polite"></div><button class="hot rsvp" id="rsvp" aria-label="Confirmar presença" disabled></button><div class="confirmed-label" id="confirmed-label" hidden>PRESENÇA CONFIRMADA</div></section><div id="notice" role="status" hidden></div><section><img src="6.png" alt="Agradecimentos. Com carinho, Dra. Sofia Souza."></section><section><img src="7.png" alt="Espaço reservado para fotografia."></section></div></main><script>
const q=new URLSearchParams(location.search), date=document.querySelector('#date');if(q.get('dia')==='21'){date.src='4.png';date.alt='Colação de grau, 21 de janeiro de 2027, quinta-feira, às 19 horas, Armazém Convention.';}const cover=document.querySelector('#cover'),inside=document.querySelector('#inside');document.querySelector('[data-open]').addEventListener('click',()=>{if(cover.classList.contains('closing'))return;cover.classList.add('closing');setTimeout(()=>{cover.hidden=true;inside.hidden=false;window.scrollTo(0,0)},matchMedia('(prefers-reduced-motion: reduce)').matches?0:800)});function notify(t){const n=document.querySelector('#notice');n.textContent=t;n.hidden=false;n.scrollIntoView({block:'nearest'})}const endpoint='https://script.google.com/macros/s/AKfycbzaJMKPzFM2nwlzthwDqkCyugmeP8dfzAyqI9splL1HLx_2jcHumaI0BjsZeLZ09VDFdQ/exec';
const token=q.get('token')||'', rsvp=document.getElementById('rsvp'), guest=document.getElementById('guest');
let seq=0, busy=false;
function lookup(){return new Promise((resolve,reject)=>{const cb='conviteCallback'+(++seq), s=document.createElement('script');let timer;function cleanup(){clearTimeout(timer);s.remove();delete window[cb]}window[cb]=v=>{cleanup();resolve(v)};s.onerror=()=>{cleanup();reject(new Error('Conexão indisponível'))};timer=setTimeout(()=>{cleanup();reject(new Error('Tempo excedido'))},15000);const u=new URL(endpoint);u.searchParams.set('token',token);u.searchParams.set('callback',cb);u.searchParams.set('_',Date.now());s.src=u.toString();document.head.append(s)})}
function apply(v){if(!v.ok)throw new Error(v.mensagem||'Convite indisponível');guest.textContent=v.nome;const d=v.data==='21/01/2027';date.src=d?'4.png':'3.png';date.alt='Colação de grau, '+v.data+', às 19 horas, Armazém Convention.';if(v.situacao==='Confirmado'){rsvp.disabled=true;document.getElementById('confirmed-label').hidden=false;const n=document.getElementById('notice');n.textContent='Presença confirmada! Sua presença será recebida com grande alegria.';n.hidden=false;return true}rsvp.disabled=false;return false}
async function init(){if(!/^[a-f0-9-]{36}$/i.test(token)){guest.textContent='Convite demonstrativo';rsvp.disabled=false;rsvp.onclick=()=>notify('Use o seu link individual para confirmar presença. Nenhum registro foi realizado.');return}guest.textContent='Carregando convite…';try{apply(await lookup())}catch(e){guest.textContent='Não foi possível identificar o convidado.';rsvp.disabled=false;rsvp.onclick=()=>{rsvp.onclick=null;rsvp.disabled=true;init()}}}
rsvp.addEventListener('click',async()=>{if(busy||!token||rsvp.disabled)return;busy=true;rsvp.disabled=true;notify('Registrando sua presença…');try{const v=await lookup();if(apply(v)){return}rsvp.disabled=true;const body=new URLSearchParams({acao:'confirmar',token});fetch(endpoint,{method:'POST',mode:'no-cors',body,credentials:'omit'}).catch(()=>{});for(let i=0;i<8;i++){await new Promise(r=>setTimeout(r,2000));try{const result=await lookup();if(result.ok&&result.situacao==='Confirmado'){apply(result);notify('Presença confirmada! Sua presença foi registrada com sucesso.');return}}catch(e){}}notify('Não foi possível verificar o registro. Tente novamente.');rsvp.disabled=false}catch(e){notify('Não foi possível confirmar agora. Tente novamente.');rsvp.disabled=false}finally{busy=false}});init();
</script></body></html>
